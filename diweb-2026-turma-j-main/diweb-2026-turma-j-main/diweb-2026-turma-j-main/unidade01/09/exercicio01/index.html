<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/icon.png">
    <title>Exemplo 01</title>

    <style>
        body {
            background-color: deepskyblue;
            color: white;
            font-family: Cambria, "Times New Roman", serif;
            font-size: 22px;
        }

        strong,
        code {
            color: gold;
            font-weight: 600;
        }

        .title {
            font-size: 50px;
        }

        .banner {
            width: 100%;
        }
    </style>
</head>

<body>
    <h1 class="title">Trabalhando com imagens externas</h1>

    <p>
        Para utilizarmos imagens externas devemos atribuir o atributo
        <strong>src</strong> da tag <code>&lt;img&gt;</code>
    </p>

    <img src="../img/banner.png"
         alt="Banner dos cursos da ETC"
         class="banner">
</body>
</html>
